<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0503">
  <title>HUB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0503;
      --panel: rgba(28, 13, 7, 0.78);
      --gold: #ffc64d;
      --gold-2: #ff9f1c;
      --gold-soft: rgba(255, 198, 77, 0.22);
      --red: #e0262d;
      --text: #fff1d6;
      --muted: #c49a6a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
    body {
      font-family: "Noto Sans Thai", system-ui, sans-serif;
      padding: max(12px, env(safe-area-inset-top)) 14px max(12px, env(safe-area-inset-bottom));
      overflow-x: hidden;
      background:
        radial-gradient(ellipse 60% 40% at 50% 0%, rgba(255, 159, 28, 0.25), transparent 70%),
        radial-gradient(ellipse 50% 35% at 50% 100%, rgba(224, 38, 45, 0.28), transparent 70%),
        repeating-linear-gradient(60deg, rgba(255, 198, 77, 0.05) 0 1px, transparent 1px 34px),
        repeating-linear-gradient(-60deg, rgba(255, 198, 77, 0.05) 0 1px, transparent 1px 34px),
        var(--bg);
      min-height: 100vh;
    }
    /* scanlines ทั่วหน้า */
    .frame { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; }
    .mono { font-family: Orbitron, sans-serif; letter-spacing: 0.18em; }

    /* ---- top bar ---- */
    .top { display: flex; justify-content: space-between; align-items: center; font-size: 10px; color: var(--muted); }
    .status { display: flex; align-items: center; gap: 8px; color: var(--gold); }
    .status i { width: 8px; height: 8px; border-radius: 50%; background: #5dff8a; box-shadow: 0 0 10px #5dff8a; animation: blink 1.6s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0.2; } }
    #clock { color: var(--gold); font-size: 12px; }

    /* ---- gauges ---- */
    .gauges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0 0; }
    .gauge {
      padding: 7px 8px 9px; background: var(--panel);
      border: 1px solid var(--gold-soft); clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    }
    .gauge .k { font-size: 9px; color: var(--muted); }
    .gauge .v { font-family: Orbitron, sans-serif; font-size: 15px; color: var(--gold); margin: 1px 0 4px; }
    .bar { height: 4px; background: rgba(255, 198, 77, 0.12); overflow: hidden; }
    .bar span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--red), var(--gold)); animation: fill 1.4s ease-out forwards; }
    @keyframes fill { to { width: var(--w); } }

    /* ---- radar + reactor ---- */
    .core-wrap { position: relative; width: 168px; height: 168px; margin: 10px auto 0; pointer-events: none; }
    .radar {
      position: absolute; inset: 0; border-radius: 50%;
      background:
        repeating-radial-gradient(circle at 50% 50%, transparent 0 28px, rgba(255, 198, 77, 0.18) 28px 29px),
        radial-gradient(circle, rgba(255, 159, 28, 0.12), rgba(10, 5, 3, 0.9) 70%);
      border: 1px solid var(--gold-soft);
      box-shadow: 0 0 40px rgba(255, 159, 28, 0.18), inset 0 0 40px rgba(255, 159, 28, 0.12);
      overflow: hidden;
    }
    .sweep {
      position: absolute; inset: 0; border-radius: 50%;
      background: conic-gradient(from 0deg, rgba(255, 198, 77, 0) 0deg, rgba(255, 198, 77, 0.45) 40deg, rgba(255, 198, 77, 0) 60deg);
      animation: spin 4s linear infinite;
    }
    .blip {
      position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%;
      left: calc(50% + var(--x) * 1px); top: calc(50% + var(--y) * 1px);
      background: var(--gold); box-shadow: 0 0 12px var(--gold);
      animation: ping 2.4s ease-out infinite; animation-delay: var(--d);
    }
    @keyframes ping { 0% { transform: scale(1); opacity: 1; } 70%, 100% { transform: scale(2.6); opacity: 0; } }
    .core {
      position: absolute; left: 50%; top: 50%; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #fff4c8, var(--gold) 45%, var(--red) 100%);
      box-shadow: 0 0 26px var(--gold), 0 0 70px rgba(255, 90, 30, 0.45);
      display: flex; align-items: center; justify-content: center;
      font-family: Orbitron, sans-serif; font-weight: 900; font-size: 11px; color: #2a0d05; letter-spacing: 0.1em;
    }
    .ring { position: absolute; inset: 14px; border-radius: 50%; border: 2px dashed rgba(255, 198, 77, 0.5); animation: spin 22s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 50% { box-shadow: 0 0 40px var(--gold), 0 0 100px rgba(255, 90, 30, 0.6); } }

    h1 { font-family: Orbitron, sans-serif; font-weight: 900; text-align: center; letter-spacing: 0.3em; margin: 6px 0 0; font-size: 18px; background: linear-gradient(90deg, var(--gold), #fff1d6, var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .sub { text-align: center; color: var(--muted); font-size: 12px; margin: 0 0 12px; }

    /* ---- link tiles ---- */
    .label-row { display: flex; align-items: center; gap: 10px; font-size: 10px; color: var(--muted); margin: 6px 0 12px; }
    .label-row::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--gold-soft), transparent); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .tile {
      position: relative; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; overflow: hidden;
      min-height: 112px; padding: 12px 12px 12px 16px; color: inherit; text-decoration: none;
      cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none;
      background: var(--panel); border: 1px solid rgba(255, 198, 77, 0.35);
      clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px);
      transition: box-shadow .2s, border-color .2s;
      -webkit-tap-highlight-color: transparent;
    }
    .tile::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: linear-gradient(var(--gold), var(--red)); }
    .tile > * { pointer-events: none; }
    .tile:hover, .tile:focus-visible { border-color: var(--gold); box-shadow: 0 0 26px rgba(255, 159, 28, 0.35); outline: none; }
    .num { position: absolute; top: 10px; right: 12px; font-family: Orbitron, sans-serif; font-size: 10px; color: var(--red); }
    .icon {
      flex: none; width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 22px; line-height: 1; background: radial-gradient(circle, rgba(255, 198, 77, 0.25), transparent 70%); border: 1px solid rgba(255, 198, 77, 0.4);
    }
    .info { min-width: 0; flex: 1; }
    .tag { font-family: Orbitron, sans-serif; font-size: 9px; letter-spacing: 0.2em; color: var(--gold-2); }
    .title { font-weight: 600; font-size: 15px; margin: 0; }
    .desc { color: var(--muted); font-size: 11px; line-height: 1.35; }
    .arrow { display: none; }
    .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 24px; border: 1px dashed var(--gold-soft); }

    /* ---- ticker ---- */
    .ticker { pointer-events: none; margin-top: 12px; overflow: hidden; white-space: nowrap; border-top: 1px solid var(--gold-soft); border-bottom: 1px solid var(--gold-soft); padding: 8px 0; font-family: Orbitron, sans-serif; font-size: 10px; color: var(--muted); letter-spacing: 0.2em; }
    /* ---- IRON STRIKE (เกมยิงเครื่องบิน) ---- */
    .game { margin-top: 16px; padding: 10px; background: var(--panel); border: 1px solid var(--gold-soft); clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px); }
    .game-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-family: Orbitron, sans-serif; font-size: 10px; letter-spacing: 0.15em; color: var(--gold); }
    .g-title { font-size: 12px; font-weight: 900; }
    .game-btn { font-family: Orbitron, sans-serif; font-size: 10px; letter-spacing: 0.15em; padding: 7px 12px; background: linear-gradient(90deg, var(--red), var(--gold-2)); color: #1a0803; border: 0; cursor: pointer; clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
    .stage { position: relative; margin-top: 8px; height: 420px; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; border: 1px solid rgba(255, 198, 77, 0.2); background: #070302; }
    .stage canvas { display: block; width: 100%; height: 100%; }
    .game-foot { display: flex; justify-content: space-between; margin-top: 8px; font-family: Orbitron, sans-serif; font-size: 9px; letter-spacing: 0.12em; color: var(--muted); }
    .game-foot b { color: var(--gold); font-weight: 700; }
    .hint-line { margin: 6px 0 0; font-size: 11px; color: var(--muted); text-align: center; }
    .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: rgba(7, 3, 2, 0.72); font-family: Orbitron, sans-serif; font-size: 13px; letter-spacing: 0.15em; color: var(--gold); text-align: center; }
    .overlay small { font-family: "Noto Sans Thai", sans-serif; font-size: 12px; letter-spacing: 0; color: var(--muted); }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  </style>
</head>
<body>
  <main class="frame">
    <div class="top mono">
      <span class="status"><i></i>ONLINE</span>
      <span id="clock">--:--:--</span>
    </div>

    <div class="gauges">
      <div class="gauge"><div class="k mono">LINKS</div><div class="v" id="g-links">0</div><div class="bar"><span style="--w: 100%"></span></div></div>
      <div class="gauge"><div class="k mono">POWER</div><div class="v">98%</div><div class="bar"><span style="--w: 98%"></span></div></div>
      <div class="gauge"><div class="k mono">SIGNAL</div><div class="v">A+</div><div class="bar"><span style="--w: 86%"></span></div></div>
    </div>

    <div class="core-wrap" aria-hidden="true">
      <div class="radar"><div class="sweep"></div></div>
      <div class="ring"></div>
      <div id="blips"></div>
      <div class="core">HUB</div>
    </div>

    <h1>CONTROL HUB</h1>
    <p class="sub">เลือกระบบที่ต้องการเปิด</p>

    <div id="grid" class="grid"></div>

    <div class="ticker mono"><span id="ticker">ALL SYSTEMS NOMINAL · TRAVEL · ENERGY · CLOCK · BOM ·</span></div>

    <section class="game" aria-label="เกมยิงเครื่องบิน">
      <div class="game-head">
        <span class="g-title">IRON STRIKE</span>
        <span>BEST <span id="g-best">0</span></span>
        <button id="g-start" class="game-btn" type="button">START</button>
      </div>
      <div id="g-stage" class="stage">
        <canvas id="g-canvas"></canvas>
        <div id="g-over" class="overlay">
          <span>IRON STRIKE</span>
          <small>ลากนิ้วเพื่อขยับชุด · ยิงอัตโนมัติ · ชนศัตรูเสียชีวิต 1 ครั้ง</small>
          <small>แตะ START เพื่อเริ่ม</small>
        </div>
      </div>
      <div class="game-foot">
        <span>SCORE <b id="g-score">0</b></span>
        <span>WAVE <b id="g-wave">1</b></span>
        <span>COMBO <b id="g-combo">x1</b></span>
      </div>
    </section>
  </main>

  <script src="links.js"></script>
  <script>
    (function () {
      var stage = document.getElementById('g-stage');
      var canvas = document.getElementById('g-canvas');
      var ctx = canvas.getContext('2d');
      var over = document.getElementById('g-over');
      var startBtn = document.getElementById('g-start');
      var bestEl = document.getElementById('g-best');
      var scoreEl = document.getElementById('g-score');
      var waveEl = document.getElementById('g-wave');
      var comboEl = document.getElementById('g-combo');

      var BEST_KEY = 'hubIronStrikeBest';
      var W = 1, H = 1, dpr = 1;
      var game = null;
      var best = readBest();
      var dragging = false;
      var target = null;
      var audio = null;
      var last = performance.now();

      bestEl.textContent = String(best);

      function readBest() { try { return Number(localStorage.getItem(BEST_KEY)) || 0; } catch (e) { return 0; } }
      function writeBest(v) { try { localStorage.setItem(BEST_KEY, String(v)); } catch (e) { /* ไม่เป็นไร */ } }

      function resize() {
        var r = stage.getBoundingClientRect();
        W = Math.max(1, r.width); H = Math.max(1, r.height);
        dpr = window.devicePixelRatio || 1;
        canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener('resize', resize);
      resize();

      function beep(freq, dur, type, vol) {
        try {
          audio = audio || new (window.AudioContext || window.webkitAudioContext)();
          var o = audio.createOscillator(), g = audio.createGain();
          o.type = type || 'square'; o.frequency.value = freq;
          g.gain.value = vol || 0.04;
          o.connect(g); g.connect(audio.destination);
          o.start(); g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
          o.stop(audio.currentTime + dur);
        } catch (e) { /* ไม่มีเสียงก็เล่นได้ */ }
      }

      function newGame() {
        return {
          running: true,
          p: { x: W / 2, y: H - 64, tx: W / 2, ty: H - 64, lives: 3, inv: 0 },
          bullets: [], enemies: [], parts: [],
          score: 0, kills: 0, wave: 1, combo: 1, comboT: 0,
          shake: 0, fireT: 0, spawnT: 0.8, t: 0
        };
      }

      function burst(x, y, color, n) {
        for (var i = 0; i < n; i++) {
          var a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 220;
          game.parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + Math.random() * 0.4, max: 0.9, color: color });
        }
      }

      function spawnEnemy() {
        var g = game, r = Math.random(), type;
        if (g.wave >= 3 && r > 0.85) type = 'dart';
        else if (g.wave >= 2 && r > 0.6) type = 'shield';
        else type = 'drone';
        var e = { x: 30 + Math.random() * Math.max(1, W - 60), y: -30, vx: 0, vy: 80 + g.wave * 12, hp: 1, r: 18, type: type, t: Math.random() * 6 };
        if (type === 'shield') { e.hp = 3; e.r = 26; e.vy *= 0.7; }
        if (type === 'dart') { e.r = 12; e.vy = 220 + g.wave * 10; }
        g.enemies.push(e);
      }

      function update(dt) {
        var g = game, p = g.p;
        g.t += dt;

        // เคลื่อนที่ตามนิ้ว (ลื่นๆ)
        if (target) { p.tx = target.x; p.ty = target.y; }
        p.x += (p.tx - p.x) * Math.min(1, dt * 14);
        p.y += (p.ty - p.y) * Math.min(1, dt * 14);
        p.x = Math.max(24, Math.min(W - 24, p.x));
        p.y = Math.max(H * 0.45, Math.min(H - 36, p.y));
        p.inv -= dt;

        // ยิงอัตโนมัติ ยิ่งด่านสูงยิ่งยิงถี่
        g.fireT -= dt;
        if (g.fireT <= 0) {
          g.bullets.push({ x: p.x, y: p.y - 22, vy: -640 });
          g.fireT = Math.max(0.07, 0.16 - g.wave * 0.012);
        }

        // ศัตรูเกิดเป็นระลอก
        g.spawnT -= dt;
        if (g.spawnT <= 0) {
          spawnEnemy();
          g.spawnT = Math.max(0.28, 1.05 - g.wave * 0.09) * (0.75 + Math.random() * 0.5);
        }

        g.bullets.forEach(function (b) { b.y += b.vy * dt; });
        g.bullets = g.bullets.filter(function (b) { return b.y > -10; });

        g.enemies.forEach(function (e) {
          e.t += dt;
          e.y += e.vy * dt;
          if (e.type === 'dart') e.x += Math.sin(e.t * 5) * 90 * dt;
        });

        // ยิงโดนศัตรู
        g.bullets = g.bullets.filter(function (b) {
          for (var i = 0; i < g.enemies.length; i++) {
            var e = g.enemies[i];
            if (Math.abs(b.x - e.x) < e.r && Math.abs(b.y - e.y) < e.r) {
              e.hp--;
              burst(b.x, b.y, '#ffc64d', 3);
              if (e.hp <= 0) {
                var pts = e.type === 'shield' ? 30 : e.type === 'dart' ? 15 : 10;
                g.score += pts * g.combo;
                g.kills++;
                g.combo = Math.min(8, g.combo + 1);
                g.comboT = 2.5;
                g.wave = 1 + Math.floor(g.kills / 12);
                burst(e.x, e.y, '#e0262d', 18);
                g.shake = Math.min(10, g.shake + 2);
                beep(520 + Math.random() * 200, 0.08, 'square', 0.03);
                g.enemies.splice(i, 1);
              }
              return false;
            }
          }
          return true;
        });

        // ศัตรูชนชุด
        g.enemies = g.enemies.filter(function (e) {
          var hit = p.inv <= 0 && Math.hypot(e.x - p.x, e.y - p.y) < e.r + 14;
          if (hit) {
            g.p.lives--;
            p.inv = 1.5;
            g.shake = 10;
            burst(p.x, p.y, '#ff9f1c', 26);
            beep(140, 0.25, 'sawtooth', 0.06);
            return false;
          }
          return e.y < H + 40 && e.y > -60;
        });

        if (g.p.lives <= 0) return endGame();

        g.comboT -= dt;
        if (g.comboT <= 0) g.combo = 1;

        g.parts.forEach(function (q) { q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.96; q.vy *= 0.96; q.life -= dt; });
        g.parts = g.parts.filter(function (q) { return q.life > 0; });
        g.shake *= Math.exp(-dt * 8);

        scoreEl.textContent = String(g.score);
        waveEl.textContent = String(g.wave);
        comboEl.textContent = 'x' + g.combo;
      }

      function endGame() {
        var s = game.score;
        game.running = false;
        if (s > best) { best = s; writeBest(best); bestEl.textContent = String(best); }
        over.innerHTML = '';
        var a = document.createElement('span'); a.textContent = 'GAME OVER';
        var b = document.createElement('small'); b.textContent = 'คะแนน ' + s + ' · ด่าน ' + game.wave + ' · ฆ่า ' + game.kills;
        var c = document.createElement('small'); c.textContent = s >= best && s > 0 ? 'ทำสถิติใหม่!' : 'แตะ START เพื่อเล่นอีกครั้ง';
        over.appendChild(a); over.appendChild(b); over.appendChild(c);
        over.style.display = 'flex';
        startBtn.textContent = 'AGAIN';
      }

      function drawSuit(p) {
        ctx.save();
        ctx.translate(p.x, p.y);
        if (p.inv > 0 && Math.floor(p.inv * 12) % 2 === 0) ctx.globalAlpha = 0.35;
        ctx.shadowColor = '#ffc64d'; ctx.shadowBlur = 18;
        // ลำตัวสีทอง หน้ากากแดง
        ctx.fillStyle = '#ffc64d';
        ctx.beginPath();
        ctx.moveTo(0, -26); ctx.lineTo(16, -6); ctx.lineTo(24, 16); ctx.lineTo(8, 10);
        ctx.lineTo(0, 20); ctx.lineTo(-8, 10); ctx.lineTo(-24, 16); ctx.lineTo(-16, -6);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#e0262d';
        ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(8, -4); ctx.lineTo(0, 2); ctx.lineTo(-8, -4); ctx.closePath(); ctx.fill();
        // แสงจากฝ่ามือ (repulsor)
        ctx.shadowColor = '#37d7ff'; ctx.shadowBlur = 16;
        ctx.fillStyle = '#e9fbff';
        ctx.beginPath(); ctx.arc(0, 22, 4 + Math.sin(game.t * 20) * 1.2, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }

      function draw() {
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.fillStyle = '#070302';
        ctx.fillRect(0, 0, W, H);

        // พื้นตารางเคลื่อนไหวเบาๆ
        var off = game ? (game.t * 60) % 40 : 0;
        ctx.strokeStyle = 'rgba(255, 198, 77, 0.08)';
        ctx.lineWidth = 1;
        for (var y = off; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
        for (var x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }

        if (!game) return;
        ctx.save();
        if (game.shake > 0.1) ctx.translate((Math.random() - 0.5) * game.shake, (Math.random() - 0.5) * game.shake);

        // กระสุน
        ctx.shadowColor = '#ffc64d'; ctx.shadowBlur = 10;
        ctx.strokeStyle = '#ffe08a'; ctx.lineWidth = 3;
        game.bullets.forEach(function (b) { ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x, b.y + 14); ctx.stroke(); });

        // ศัตรู
        game.enemies.forEach(function (e) {
          ctx.save();
          ctx.translate(e.x, e.y);
          if (e.type === 'shield') {
            ctx.shadowColor = '#ff9f1c'; ctx.shadowBlur = 14;
            ctx.strokeStyle = '#ff9f1c'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.arc(0, 0, e.r, 0, Math.PI * 2 * (e.hp / 3)); ctx.stroke();
            ctx.strokeStyle = 'rgba(224,38,45,0.6)'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(0, 0, e.r - 7, 0, Math.PI * 2); ctx.stroke();
          } else if (e.type === 'dart') {
            ctx.shadowColor = '#e0262d'; ctx.shadowBlur = 14;
            ctx.fillStyle = '#e0262d';
            ctx.beginPath(); ctx.moveTo(0, 14); ctx.lineTo(10, -10); ctx.lineTo(0, -4); ctx.lineTo(-10, -10); ctx.closePath(); ctx.fill();
          } else {
            ctx.shadowColor = '#e0262d'; ctx.shadowBlur = 12;
            ctx.strokeStyle = '#e0262d'; ctx.lineWidth = 2.5;
            ctx.beginPath(); ctx.arc(0, 0, e.r, 0, Math.PI * 2); ctx.stroke();
            ctx.strokeStyle = '#ffc64d'; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(8, 0); ctx.moveTo(0, -8); ctx.lineTo(0, 8); ctx.stroke();
          }
          ctx.restore();
        });

        if (game.running || game.p.lives > 0) drawSuit(game.p);

        // อนุภาค
        game.parts.forEach(function (q) {
          ctx.globalAlpha = Math.max(0, q.life / q.max);
          ctx.fillStyle = q.color;
          ctx.shadowColor = q.color; ctx.shadowBlur = 8;
          ctx.beginPath(); ctx.arc(q.x, q.y, 2.5, 0, Math.PI * 2); ctx.fill();
        });
        ctx.globalAlpha = 1;
        ctx.restore();

        // HUD: ชีวิต
        ctx.shadowBlur = 0;
        for (var i = 0; i < 3; i++) {
          ctx.fillStyle = i < game.p.lives ? '#ffc64d' : 'rgba(255,198,77,0.15)';
          ctx.beginPath(); ctx.arc(18 + i * 18, 20, 6, 0, Math.PI * 2); ctx.fill();
        }
      }

      // วาดวนเฉพาะตอนเล่นอยู่ ตอนพักวาดครั้งเดียว ไม่กินเครื่อง
      var looping = false;
      function loop(now) {
        var dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        if (game && game.running) {
          update(dt);
          draw();
          requestAnimationFrame(loop);
        } else {
          draw();
          looping = false;
        }
      }
      function startLoop() {
        if (looping) return;
        looping = true;
        last = performance.now();
        requestAnimationFrame(loop);
      }
      draw();

      function setTargetFrom(e) {
        var r = stage.getBoundingClientRect();
        target = { x: e.clientX - r.left, y: e.clientY - r.top };
      }
      stage.addEventListener('pointerdown', function (e) {
        dragging = true;
        try { stage.setPointerCapture(e.pointerId); } catch (err) { /* ไม่เป็นไร */ }
        setTargetFrom(e);
      });
      stage.addEventListener('pointermove', function (e) { if (dragging) setTargetFrom(e); });
      function stopDrag() { dragging = false; target = null; }
      stage.addEventListener('pointerup', stopDrag);
      stage.addEventListener('pointercancel', stopDrag);

      startBtn.addEventListener('click', function () {
        if (game && game.running) return;
        try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === 'suspended') audio.resume(); } catch (e) { /* ไม่มีเสียง */ }
        game = newGame();
        over.style.display = 'none';
        startBtn.textContent = 'START';
        startLoop();
        scoreEl.textContent = '0';
        waveEl.textContent = '1';
        comboEl.textContent = 'x1';
      });
    })();
  </script>
  <script>
    (function () {
      var grid = document.getElementById('grid');
      var blips = document.getElementById('blips');
      var links = Array.isArray(window.HUB_LINKS) ? window.HUB_LINKS : [];
      document.getElementById('g-links').textContent = String(links.length);

      if (!links.length) {
        var empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'ยังไม่มีลิงก์ — เพิ่มได้ในไฟล์ links.js';
        grid.appendChild(empty);
      }

      links.forEach(function (l, i) {
        // จุดบนเรดาร์ กระจายตามจำนวนลิงก์
        var angle = (i / Math.max(links.length, 1)) * Math.PI * 2 - Math.PI / 2;
        var r = 62;
        var b = document.createElement('div');
        b.className = 'blip';
        b.style.setProperty('--x', Math.round(Math.cos(angle) * r));
        b.style.setProperty('--y', Math.round(Math.sin(angle) * r));
        b.style.setProperty('--d', (i * 0.5) + 's');
        blips.appendChild(b);

        var url = String(l.url || '#');
        var a = document.createElement('a');
        a.className = 'tile';
        // รับเฉพาะลิงก์ http(s) หรือ path ในเว็บเดียวกัน
        a.href = /^(https?:\/\/|[\w\-./]+$)/.test(url) ? url : '#';
        if (/^https?:\/\//.test(url)) { a.target = '_blank'; a.rel = 'noopener'; }

        var num = document.createElement('div'); num.className = 'num'; num.textContent = String(i + 1).padStart(2, '0');
        var icon = document.createElement('div'); icon.className = 'icon'; icon.textContent = l.icon || '◎';
        var info = document.createElement('div'); info.className = 'info';
        var tag = document.createElement('div'); tag.className = 'tag'; tag.textContent = l.tag || 'LINK';
        var title = document.createElement('div'); title.className = 'title'; title.textContent = l.title || 'ไม่มีชื่อ';
        var desc = document.createElement('div'); desc.className = 'desc'; desc.textContent = l.desc || '';
        info.appendChild(tag); info.appendChild(title); info.appendChild(desc);
        var arrow = document.createElement('div'); arrow.className = 'arrow'; arrow.textContent = '▸';

        a.appendChild(num); a.appendChild(icon); a.appendChild(info); a.appendChild(arrow);
        grid.appendChild(a);
      });

      var clock = document.getElementById('clock');
      function tick() {
        try {
          clock.textContent = new Date().toLocaleTimeString('th-TH', { timeZone: 'Asia/Bangkok', hour12: false });
        } catch (e) { /* ไม่ต้องแสดงเวลาก็ได้ */ }
      }
      tick();
      setInterval(tick, 1000);
    })();
  </script>
</body>
