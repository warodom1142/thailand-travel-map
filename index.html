<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>แผนที่เที่ยวไทย</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🇹🇭 แผนที่เที่ยวไทย</h1>
    <input id="search" type="search" placeholder="ค้นหาชื่อ / จังหวัด / รายละเอียด">
    <select id="filter-category"><option value="">ทุกหมวด</option></select>
    <button id="btn-add" class="primary">+ เพิ่มสถานที่</button>
  </header>

  <div id="status"></div>

  <main>
    <div id="map"></div>
    <aside id="panel" hidden></aside>
  </main>

  <dialog id="dlg">
    <form id="form" autocomplete="off">
      <h2 id="form-title">เพิ่มสถานที่ใหม่</h2>

      <label>ชื่อสถานที่ *
        <input name="name" required>
      </label>

      <div class="row">
        <label>หมวด
          <select name="category" id="form-category"></select>
        </label>
        <label>จังหวัด
          <input name="province" list="provinces">
          <datalist id="provinces"></datalist>
        </label>
      </div>

      <div class="row">
        <label>ละติจูด *
          <input name="lat" type="number" step="any" required>
        </label>
        <label>ลองจิจูด *
          <input name="lng" type="number" step="any" required>
        </label>
      </div>
      <button type="button" id="btn-geo">📍 ใช้ตำแหน่งปัจจุบัน</button>

      <div class="row">
        <label>ให้คะแนน
          <select name="rating" id="form-rating"></select>
        </label>
        <label>วันที่ไป
          <input name="visited" type="date">
        </label>
      </div>

      <label>รายละเอียด
        <textarea name="description" rows="4"></textarea>
      </label>

      <label>รูปภาพ
        <input type="file" id="photos" accept="image/*" multiple>
      </label>
      <div id="form-photos" class="thumbs"></div>

      <p id="form-error" class="error"></p>

      <div class="actions">
        <button type="button" id="btn-cancel">ยกเลิก</button>
        <button type="submit" id="btn-save" class="primary">บันทึก</button>
      </div>
    </form>
  </dialog>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
