<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="เที่ยวไทย">
  <meta name="theme-color" content="#ffffff">
  <title>เที่ยวไทย</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <div class="topbar">
    <div class="search">
      <span>⌕</span>
      <input id="search" type="search" placeholder="ค้นหาสถานที่หรือจังหวัด" enterkeyhint="search">
    </div>
    <div id="chips" class="chips"></div>
  </div>

  <div id="pick-banner" class="pick-banner" hidden>
    <span>แตะบนแผนที่เพื่อปักหมุด</span>
    <button id="btn-pick-here" type="button">📍 ใช้ตำแหน่งฉัน</button>
    <button id="btn-pick-cancel" type="button">ยกเลิก</button>
  </div>

  <button id="btn-locate" class="locate" type="button" aria-label="หาตำแหน่งของฉัน">📍</button>
  <button id="btn-add" class="fab" type="button" aria-label="เพิ่มสถานที่">+</button>
  <div id="status" class="status"></div>

  <!-- detail sheet -->
  <section id="detail" class="sheet" hidden>
    <div class="grabber"></div>
    <button class="round-x" data-act="close" type="button" aria-label="ปิด">✕</button>
    <div class="sheet-inner" id="detail-body"></div>
  </section>

  <!-- editor sheet -->
  <section id="editor" class="sheet" hidden>
    <div class="grabber"></div>
    <form id="form" novalidate>
      <div class="sheet-head">
        <button type="button" class="ghost" id="btn-cancel">ยกเลิก</button>
        <h2 id="form-title"></h2>
        <button type="submit" class="ghost strong" id="btn-save">บันทึก</button>
      </div>

      <div class="sheet-inner form-body">
        <input type="hidden" name="category">

        <div class="section">
          <label class="label" for="f-name">ชื่อสถานที่</label>
          <input id="f-name" name="name" class="field" placeholder="เช่น ดอยอินทนนท์" autocomplete="off">
        </div>

        <div class="section">
          <label class="label" for="f-search">ค้นหาสถานที่หรือที่อยู่</label>
          <div class="search-row">
            <input id="f-search" class="field" placeholder="เช่น ดอยอินทนนท์, วัดพระแก้ว" autocomplete="off" enterkeyhint="search">
            <button type="button" id="btn-addr" class="pill">ค้นหา</button>
          </div>
          <small id="addr-hint" class="hint">พิมพ์ชื่อหรือที่อยู่ แล้วกดค้นหา ระบบจะหาพิกัดและจังหวัดให้</small>
        </div>

        <div class="section">
          <span class="label">หมวดหมู่</span>
          <div id="form-cats" class="cat-grid"></div>
        </div>

        <div class="section">
          <span class="label">จังหวัด</span>
          <div class="prov-box">
            <div class="prov-now">
              <strong id="prov-name">ยังไม่ระบุ</strong>
              <small id="prov-hint" class="hint"></small>
            </div>
            <button type="button" id="btn-prov-change" class="link">เปลี่ยน</button>
          </div>
          <div id="prov-picker" class="select-wrap" hidden>
            <label class="sr" for="f-prov">เลือกจังหวัด</label>
            <select id="f-prov" name="province" class="field select"><option value="">— เลือกจังหวัด —</option></select>
          </div>
        </div>

        <div class="section">
          <span class="label">คะแนน</span>
          <div id="form-stars" class="stars"></div>
        </div>

        <div class="section">
          <span class="label">วันที่ไป</span>
          <div class="date-row">
            <label class="date-field">
              <small>จาก</small>
              <input id="date-from" type="date" class="field">
            </label>
            <label class="date-field">
              <small>ถึง</small>
              <input id="date-to" type="date" class="field">
            </label>
          </div>
          <p id="date-error" class="field-error"></p>
          <div class="date-summary">
            <span id="date-summary">ยังไม่ได้เลือกวัน</span>
            <button type="button" id="btn-clear-date" class="link">ล้าง</button>
          </div>
          <small class="hint">ถ้าไปวันเดียวใส่แค่ "จาก" ได้เลย</small>
        </div>

        <div class="section">
          <label class="label" for="f-desc">รายละเอียด</label>
          <textarea id="f-desc" name="description" class="field" rows="4" placeholder="ร้านไหนอร่อย ที่จอดรถ ฯลฯ"></textarea>
        </div>

        <div class="section">
          <span class="label">รูปภาพ</span>
          <div id="photo-grid" class="photo-grid"></div>
        </div>

        <details class="section coords">
          <summary class="label">พิกัด</summary>
          <div class="row2">
            <input name="lat" type="number" step="any" class="field" placeholder="ละติจูด">
            <input name="lng" type="number" step="any" class="field" placeholder="ลองจิจูด">
          </div>
          <button type="button" id="btn-geo" class="pill">📍 ใช้ตำแหน่งปัจจุบัน</button>
        </details>

        <p id="form-error" class="error"></p>
      </div>
    </form>
  </section>

  <!-- lightbox -->
  <div id="lightbox" class="lightbox" hidden>
    <button id="lb-close" class="lb-close" type="button" aria-label="ปิด">✕</button>
    <div id="lb-track" class="lb-track"></div>
    <div id="lb-count" class="lb-count"></div>
  </div>

  <!-- popup ระหว่างบันทึก -->
  <div id="busy" class="busy" hidden>
    <div class="busy-card">
      <div class="spinner"></div>
      <p id="busy-text">กำลังบันทึก…</p>
      <small id="busy-sub"></small>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
